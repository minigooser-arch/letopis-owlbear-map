[project]
name = "letopis-map-exporter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
letopis-map-export = "letopis_map_exporter.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
